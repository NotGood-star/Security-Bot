services:
  - type: web
    name: discord-oauth-utility-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: CLIENT_SECRET
        sync: false
      - key: GUILD_ID
        sync: false
      - key: ANNOUNCEMENT_CHANNEL_ID
        sync: false
      - key: BASE_URL
        sync: false
      - key: OAUTH_REDIRECT_URI
        sync: false
      - key: ADMIN_USER_IDS
        sync: false
      - key: LOG_CHANNEL_ID
        sync: false
      - key: DM_BATCH_SIZE
        value: "5"
      - key: DM_BATCH_DELAY_MS
        value: "3000"
      - key: PORT
        value: "3000"
